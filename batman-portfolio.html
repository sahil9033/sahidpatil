<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="sahil-patil.jpg" type="image/jpeg" />
    <link

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"

<body class="project-detail-page">
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-blob"></div>
        <div class="ambient-blob"></div>
        <div class="ambient-blob"></div>
    </div>

    <header class="detail-header">
        <a href="index.html#projects" class="detail-back"><i class="fas fa-arrow-left"></i> Back to projects</a>

                <figure class="detail-shot glass">
                    <img src="l_2.png" alt="Batman theme portfolio by Sahil Patil screen 2" />

                <figure class="detail-shot glass">
                    <img src="l_3.png" alt="Batman theme portfolio by Sahil Patil screen 3" />
                </figure>
                <figure class="detail-shot glass">
